# =============================================================================
# .github/workflows/mlops_cicd.yaml
# =============================================================================
# Copy this file to .github/workflows/ in your repository.
# Every push to main or PR triggers the full ML CI/CD pipeline.
#
# Stages:
#   1. lint-and-test    → code quality + unit tests
#   2. data-validation  → check data integrity
#   3. train-and-eval   → full training pipeline
#   4. model-tests      → behavior + performance tests
#   5. build-docker     → containerize the model server
#   6. deploy-staging   → push to staging environment
#   7. deploy-prod      → manual approval gate → production
# =============================================================================

name: MLOps CI/CD Pipeline

# Trigger conditions
on:
  push:
    branches: [ main, develop ]
    paths:
      - "**.py"           # Only run when Python files change
      - "requirements.txt"
      - "dvc.yaml"
      - "params.yaml"
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"   # Daily at 2 AM — catch data drift issues

env:
  # Centralize env vars — override in GitHub Secrets for production
  MLFLOW_TRACKING_URI: "http://mlflow-server:5000"
  MODEL_REGISTRY_NAME: "breast_cancer_classifier"
  MIN_ROC_AUC:         "0.90"
  DOCKER_REGISTRY:     "ghcr.io/your-org"

jobs:

  # ── JOB 1: Lint and Unit Tests ────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black isort mypy

      - name: Lint with flake8
        run: |
          # Fail on syntax errors; warn on style
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=100 --statistics

      - name: Check formatting with black
        run: black --check --line-length 100 .

      - name: Sort imports with isort
        run: isort --check-only --profile black .

      - name: Run unit tests with coverage
        run: |
          pytest test_model.py -v --cov=. --cov-report=xml \
            -k "TestData or TestModelBehavior"

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  # ── JOB 2: Data Validation ─────────────────────────────────────────────────
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt dvc

      - name: Pull latest data
        run: |
          dvc pull data/   # Download data from DVC remote (S3/GCS)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate data integrity
        run: python -c "
          from pipeline import run_data_pipeline, PipelineConfig
          config = PipelineConfig()
          X_train, X_test, y_train, y_test, data_hash = run_data_pipeline(config)
          print('Data validation passed. Hash:', data_hash[:12])
        "

  # ── JOB 3: Training ────────────────────────────────────────────────────────
  train:
    name: Train & Evaluate
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: python pipeline.py
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}

      - name: Check quality gates
        run: |
          python -c "
          import json
          with open('metrics.json') as f:
              metrics = json.load(f)
          roc_auc = metrics['roc_auc']
          threshold = float('${{ env.MIN_ROC_AUC }}')
          if roc_auc < threshold:
              print(f'QUALITY GATE FAILED: ROC-AUC {roc_auc} < {threshold}')
              exit(1)
          print(f'Quality gate passed: ROC-AUC={roc_auc}')
          "

      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: model-artifacts
          path: model_artifacts/
          retention-days: 30

      - name: Upload metrics
        uses: actions/upload-artifact@v3
        with:
          name: metrics
          path: metrics.json

  # ── JOB 4: Model Tests ─────────────────────────────────────────────────────
  model-tests:
    name: Model Tests
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v3
        with:
          name: model-artifacts
          path: model_artifacts/

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run model tests
        run: pytest test_model.py -v -k "TestModelPerformance or TestPipeline"

  # ── JOB 5: Build Docker Image ──────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: model-tests
    if: github.ref == 'refs/heads/main'   # Only on main branch
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v3
        with:
          name: model-artifacts
          path: model_artifacts/

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/ml-model:${{ github.sha }} .
          docker tag ${{ env.DOCKER_REGISTRY }}/ml-model:${{ github.sha }} \
                     ${{ env.DOCKER_REGISTRY }}/ml-model:latest

      - name: Push to registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.DOCKER_REGISTRY }}/ml-model:${{ github.sha }}
          docker push ${{ env.DOCKER_REGISTRY }}/ml-model:latest

  # ── JOB 6: Deploy to Staging (automatic) ──────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    environment:
      name: staging
      url: https://staging.your-ml-api.com
    steps:
      - name: Deploy to staging
        run: |
          # In production: kubectl set image, helm upgrade, or AWS ECS deploy
          echo "Deploying ${{ github.sha }} to staging..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/ml-model:${{ github.sha }}"

      - name: Run smoke tests on staging
        run: |
          # Hit the staging API and verify it responds correctly
          curl -f https://staging.your-ml-api.com/health || exit 1
          echo "Smoke test passed!"

  # ── JOB 7: Deploy to Production (MANUAL APPROVAL) ─────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production          # GitHub environment with required reviewers
      url: https://api.your-ml-api.com
    # This job PAUSES here and waits for a human to approve in GitHub UI
    steps:
      - name: Deploy to production
        run: |
          echo "✅ Approved! Deploying ${{ github.sha }} to production..."
          # kubectl set image deployment/ml-model ml-model=${{ env.DOCKER_REGISTRY }}/ml-model:${{ github.sha }}

      - name: Post-deployment validation
        run: |
          sleep 30   # Wait for pods to restart
          curl -f https://api.your-ml-api.com/health || exit 1
          echo "Production deployment validated!"

      - name: Notify team on Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "✅ Model deployed to production: ${{ github.sha }}"
